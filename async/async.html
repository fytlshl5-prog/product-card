<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карточки пользователей</title>
    <link rel="stylesheet" href="./async.css" />
  </head>
  <body>
    <div id="container">
      <div id="button-controls">
        <button class="style-button" id="show-all-btn">
          Получить все карточки
        </button>
        <button class="style-button" id="delete-all-btn">
          Удалить все карточки
        </button>
      </div>

      <div id="status-message"></div>
      <div id="cards-container"></div>
    </div>

    <template id="card-template">
      <div class="card">
        <img class="user-image" alt="" width="200" />

        <div class="card-info">
          <p class="info">
            Имя: &nbsp; <span id="style-info" class="user-name"></span>
          </p>
          <p class="info">
            Фамилия: &nbsp;<span id="style-info" class="user-surname"></span>
          </p>
          <p class="info">
            Почта: &nbsp;<span id="style-info" class="user-email"></span>
          </p>
          <p class="info">
            Возраст:&nbsp; <span id="style-info" class="user-age"></span>
          </p>
          <button class="delete-card-btn">Удалить</button>
        </div>
      </div>
    </template>
    <script src="async.js" defer></script>
  </body>
</html>
