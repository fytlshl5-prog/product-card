<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 11</title>
    <link rel="stylesheet" href="./style/subscribe.css" />
    <link rel="stylesheet" href="./style/style-11.css">
    <link rel="stylesheet" href="./style/buttons.css">
    <link rel="stylesheet" href="./style/modal.css">
  </head>
  <body class="style__header">
    <div class="style__body">
    <div class="style__contacts">
      <h2 class="style__product-card">Product Cards</h2>
      <p class="style__comment">У Нас Самые Лучшие Продукты Для Кожи!</p>
      <a href="">
        <img class="style__image" src="./images/tg.png" alt="" />
        <img class="style__image"  src="./images/vk.png" alt="" />
      </a>
    </div>
  <div class="subscribe__row">
        <h3 class="subscribe__title">Подпишись на наши акции:</h3>
    <form action="" method="get" class="subscribe__form">
        <input  class="subscribe__input" type="email"  placeholder="Введи Email..." />
      <button type="submit" class="subscribe__button">|&nbsp Подписаться</button>
      
    </form>
    <button id="open__btn" class="button__registration">Регистрация</button>
    
</div>

    <nav class="style__nav">
      <h3 class="style__text">Быстрые ссылки</h3>
      <ul class="style__link">
        <li class="style__variants"><a href="#" style="color: white;">Главная</a></li>
        <li class="style__variants"><a href="#" style="color: white;">Магазин</a></li>
        <li class="style__variants"><a href="#" style="color: white;">Контакты</a></li>
      </ul>
    </nav> 
     <article class="style__article">
      <footer>
        <p>
            <hr class="style__underscore">
          <a class="style__adress">www.product-cards.com©all right reserve</a>
        </p>
      </footer>
    </article>
    
    <div class="modal__overLay">
      <div class="modal__content"> 
        <form id="modal__registration" class="modal__form">
                  <button type="button" id="close__btn">&times;</button>
                  <h2 class="style__registration">Р Е Г И С Т Р А Ц И Я</h2>

                <div class="modal__form__group">
                    <label for="modal-first-name" class="style__registration__text">Имя:</label>
                    <input type="text" id="modal__first__name" name="modal__name" placeholder="Ваше имя" required>
                </div>

                <div class="modal__form__group">
                    <label for="modal-first-surname" class="style__registration__text">Фамилия:</label>
                    <input type="text" id="modal__first__surname" name="modal__surname" placeholder="Ваша фамилия" required>
                </div>

                <div class="modal__form__group">
                    <label for="modal__first__DateOfBirth" class="style__registration__text">Дата рождения:</label>
                    <input type="date" id="modal__first__DateOfBirth" name="modal__DateOfBirth" required>
                </div>

                <div class="modal__form__group">
                    <label for="modal__first__DateOfBirth" class="style__registration__text">Логин:</label>
                    <input type="password" id="modal__first__login" name="modal__login" required placeholder="Ваш логин">
                </div>

                <div class="modal__form__group">
                    <label for="modal__first__password" class="style__registration__text">Пароль:</label>
                    <input type="password" id="modal__first__password" name="modal__password" placeholder="Не более 6 символов" required>
                </div>

                <div class="modal__form__group">
                    <label for="modal__first-repeated__password" class="style__registration__text">Повторите пароль:</label>
                    <input type="password" id="modal__first__repeated__password" name="modal__repeated--password" placeholder="Не более 6 символов" required>
                </div>

                <button type="submit" class="btn__submit">ЗАРЕГИСТРИРОВАТЬСЯ</button>

        </form>
      </div>
    </div>
  </div>
    <script type="module" src="homework-11.js"></script>
  </body>
 
    
</html>
